          YNA('dbEarth', 'Does the board have correct means of earthing in line with BS 7671?', { reg: 'BS 7671 542' }),
          YNA('blanks', 'Are all blanks fitted with no gaps?'), YNA('cableLabels', 'Are all outgoing cables labelled at both ends?'),
          MP('dbPhotos', 'Photos of the board installation', { req: 1 })
        ] }] },
        { title: 'Sign off', sections: [{ title: 'Completion', fields: [

          R('otherEvcps', 'Have all other charge points on site been visually inspected before leaving?', ['All charge points on site visually inspected', 'No other charge points on site'], { req: 1 }),
          TA('otherFindings', 'What did you find on the other charge points?', { req: 1, when: c => c.s('otherEvcps') === 'All charge points on site visually inspected' }),

        { title: 'Site Information', sections: [{ title: 'Site Information', fields: [
          T('job', 'AJS Energy job reference', { req: 1 }), T('client', 'Client', { req: 1 }), T('clientRef', 'Client reference'),

      const clampPositive = (el, f) => {

        case 'yesno': case 'ynna': {
          const opts = f.type === 'ynna' ? ['N/A', 'Yes', 'No'] : ['Yes', 'No'];

            b.textContent = o; b.onclick = () => { V[k] = V[k] === o ? null : o; draw(); }; g.appendChild(b); }); d.appendChild(g); break;
        }
        case 'radio': {
          const g = mk('div', { display: 'grid', gridTemplateColumns: window.innerWidth < 480 ? '1fr' : '1fr 1fr', gap: '7px' });
          f.options.forEach(o => { const on = V[k] === o;
            const b = mk('button', { textAlign: 'left', border: (on ? '2px' : '1px') + ' solid ' + (on ? C.dark : C.line), background: on ? C.pale : C.white, borderRadius: '6px', padding: on ? '8px 10px' : '9px 11px', fontSize: '14px', color: on ? C.dark : C.muted, fontWeight: on ? 700 : 400, fontFamily: C.bodyFont });
            b.textContent = o; b.onclick = () => { V[k] = V[k] === o ? null : o; draw(); }; g.appendChild(b); }); d.appendChild(g); break;
        }
        case 'multi': {
          if (!Array.isArray(V[k])) V[k] = [];
          const g = mk('div', { display: 'grid', gridTemplateColumns: window.innerWidth < 480 ? '1fr' : '1fr 1fr', gap: '7px' });
          f.options.forEach(o => { const on = V[k].includes(o);
            const b = mk('button', { textAlign: 'left', border: (on ? '2px' : '1px') + ' solid ' + (on ? C.dark : C.line), background: on ? C.pale : C.white, borderRadius: '6px', padding: on ? '8px 10px' : '9px 11px', fontSize: '14px', color: on ? C.dark : C.muted, fontWeight: on ? 700 : 400, fontFamily: C.bodyFont });
            b.textContent = (on ? '✓ ' : '') + o; b.onclick = () => { on ? V[k].splice(V[k].indexOf(o), 1) : V[k].push(o); draw(); }; g.appendChild(b); }); d.appendChild(g); break;
        }
        case 'meas': {
          const w = mk('div', { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' });
          const lim = V[k + '_lim'];
          const i = mk('input', { ...inputBase, width: '108px', flex: 'none' }); i.type = 'number'; i.step = '0.01'; i.min = '0'; i.inputMode = 'decimal';
          i.value = V[k] ?? ''; i.disabled = !!lim;
          i.oninput = e => { V[k] = clampPositive(e.target, f); renderAlerts(); }; i.onblur = () => draw();
          const u = mk('span', { fontSize: '13px', color: C.muted, minWidth: '34px' }); u.textContent = f.unit || '';
          const lb = mk('button', { border: '1px solid ' + (lim ? C.dk : C.line), background: lim ? C.dk : C.white, color: lim ? '#fff' : C.muted, borderRadius: '6px', padding: '7px 12px', fontSize: '12.5px', fontWeight: lim ? 700 : 400, fontFamily: C.bodyFont });
          lb.textContent = lim || 'Limitation'; lb.onclick = () => { V[k + '_lim'] = lim ? null : 'LIM'; if (V[k + '_lim']) delete V[k]; draw(); };
          w.append(i, u, lb);
          const v = verdict(f, k);
          if (v !== null) { const vs = mk('span', { fontSize: '12px', fontWeight: 700, marginLeft: '2px', color: v === 'LIM' ? C.dk : v ? C.ok : C.req }); vs.textContent = v === 'LIM' ? 'Limitation recorded' : v ? 'Within limit' : 'Outside limit'; w.appendChild(vs); }
          d.appendChild(w);
          if (f.min !== undefined || f.max !== undefined) { const h = mk('span', { display: 'block', fontSize: '12px', color: C.faint, marginTop: '6px' }); h.textContent = (f.min !== undefined ? 'Minimum ' + f.min : 'Maximum ' + f.max) + ' ' + f.unit; d.appendChild(h); }
          break;
        }
        case 'geo': {
          const g = mk('div', { display: 'flex' });
          const b = mk('button', { border: '1px solid ' + (V[k] ? C.dark : C.line), background: V[k] ? C.dark : C.white, color: V[k] ? '#fff' : C.muted, borderRadius: '6px', padding: '8px 16px', fontFamily: C.bodyFont, fontWeight: V[k] ? 700 : 400 });
          b.textContent = V[k] || 'Capture location';
          b.onclick = () => { b.textContent = 'Locating'; if (!navigator.geolocation) { V[k] = 'unavailable on this device'; draw(); return; }

          g.appendChild(b); d.appendChild(g); break;
        }
        case 'photo': case 'multiphoto': {
          const many = f.type === 'multiphoto'; if (!Array.isArray(V[k])) V[k] = [];
          const cams = mk('div', { display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'flex-start' });
          V[k].forEach((p, i) => { const th = mk('div', { position: 'relative', width: '80px', height: '80px' });
            const img = mk('img', { width: '100%', height: '100%', objectFit: 'cover', borderRadius: '6px', border: '1px solid ' + C.line, display: 'block' }); img.src = p.url; img.alt = f.label;
            const x = mk('button', { position: 'absolute', top: '-6px', right: '-6px', width: '22px', height: '22px', borderRadius: '50%', background: C.req, color: '#fff', border: '2px solid #fff', fontSize: '13px', lineHeight: 1, padding: 0 }); x.textContent = '×'; x.title = 'Remove'; x.onclick = () => { V[k].splice(i, 1); draw(); };
            th.append(img, x); cams.appendChild(th); });
          if (many || V[k].length === 0) { const add = mk('button', { border: '1px dashed ' + C.line, background: '#fbfcfc', borderRadius: C.radiusSm + 'px', width: '80px', height: '80px', color: C.blue, fontSize: '11px', lineHeight: 1.3, padding: '6px', fontFamily: C.bodyFont });
            add.innerHTML = '+<br>' + (many ? 'Add photos' : 'Add photo'); add.onmouseenter = () => S(add, { borderColor: C.blue, background: C.pale }); add.onmouseleave = () => S(add, { borderColor: C.line, background: '#fbfcfc' }); add.onclick = () => grab(k, many); cams.appendChild(add); }
          d.appendChild(cams);
          if (V[k].length) { const kb = mk('div', { fontSize: '11px', color: C.faint, marginTop: '6px' }); const a = V[k].reduce((t, p) => t + p.after, 0), b = V[k].reduce((t, p) => t + p.before, 0); kb.textContent = V[k].length + ' image(s), ' + a + ' KB to upload, down from ' + b + ' KB'; d.appendChild(kb); }

        }
        case 'sig': {
          const w = mk('div', { border: '1px solid ' + C.line, borderRadius: C.radiusSm + 'px', background: '#fdfdfd' });
          const c = mk('canvas', { display: 'block', width: '100%', height: '128px', touchAction: 'none', borderRadius: C.radiusSm + 'px' });
          const bar = mk('div', { display: 'flex', gap: '8px', padding: '8px 10px', borderTop: '1px solid ' + C.line, fontSize: '12px', color: C.faint, alignItems: 'center', fontFamily: C.bodyFont });

          bar.append(lbl, clr); w.append(c, bar); d.appendChild(w); requestAnimationFrame(() => initSig(c, k)); break;

              b.innerHTML = esc(m.name) + '<span style="display:block;font-size:12px;color:' + C.faint + ';font-weight:400;margin-top:2px">' + m.type + (m.kw ? ', ' + m.kw + ' kW' : '') + (m.desc ? '. ' + esc(m.desc) : '') + '</span>';
              b.onclick = () => { V[modk] = V[modk] === m.name ? null : m.name; delete V[vark]; draw(); }; g.appendChild(b); }); d.appendChild(g);

    }

    function verdict(f, k) { if (V[k + '_lim']) return 'LIM'; const v = V[k]; if (v === undefined || v === null || v === '') return null; const n = parseFloat(v); if (isNaN(n)) return null;
      if (f.min !== undefined) return n >= f.min; if (f.max !== undefined) return n <= f.max; return null; }

    function initSig(c, k) {
      const dpr = window.devicePixelRatio || 1, w = c.clientWidth || 300, h = 128; c.width = w * dpr; c.height = h * dpr;
      const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2; x.lineCap = 'round'; x.strokeStyle = C.dark;
      if (V[k]) { const i = new Image(); i.onload = () => x.drawImage(i, 0, 0, w, h); i.src = V[k]; }
      let drawing = false; const pt = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

      c.onpointermove = e => { if (!drawing) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); };

    }

    function grab(k, many) {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment'; inp.multiple = !!many;
      inp.onchange = () => { const files = [...inp.files]; let done = 0;
        files.forEach(f => { const before = Math.round(f.size / 1024); const img = new Image();
          img.onload = () => { const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const url = c.toDataURL('image/jpeg', 0.8); V[k].push({ name: f.name, url, before, after: Math.round(url.length * 0.75 / 1024) });
            if (++done === files.length) { draw(); if (!online) { queue++; net(); } } }; img.src = URL.createObjectURL(f); }); };
      inp.click();
    }

    function filled(k, f) { if (f.type === 'note') return true; const v = V[k];
      if (f.type === 'photo' || f.type === 'multiphoto' || f.type === 'multi') return Array.isArray(v) && v.length > 0;
      if (f.type === 'meas') return V[k + '_lim'] || (v !== undefined && v !== null && String(v).trim() !== '');
      if (f.type === 'charger') { if (!v || !V[k + '_model']) return false; const vr = RANGE[v].variant; if (vr && vr.when(V[k + '_model']) && !V[k + '_variant']) return false; return true; }
      return v !== undefined && v !== null && String(v).trim() !== ''; }

    function missing() { const out = []; walk((f, si, r, pi) => { if (f.type === 'note' || !f.req) return; if (!visible(f, si, r)) return; if (!filled(key(si, f.id, r), f)) out.push({ label: f.label, page: pi, rep: r }); }); return out; }

    function gates() { const out = []; walk((f, si, r) => { if (!visible(f, si, r)) return; const k = key(si, f.id, r);
      if (f.gate && V[k] === f.gate) {
        if (f.id === 'safeToOperate') out.push('A charge point is recorded as unsafe to remain in operation. Isolate the supply.');
        else if (f.id === 'simultaneous') out.push('Simultaneous contact with a different earthing system is possible. This must be resolved before the unit is left in service.');
        else if (f.id === 'penMethod' || f.id === 'penFitted') out.push('PME supply with an outdoor vehicle space and no compliant open PEN fault protection. Isolate the supply.');
        else if (f.id === 'penTest') out.push('PEN fault protection has not been proven by test. Do not leave in service.');
        else if (f.id === 'rcdTypeB') out.push('No integral DC detection is declared and a Type B RCD is not fitted. Isolate the supply.');
        else if (f.id === 'rcdCorrect') out.push('The RCD type is not correct for this equipment. Isolate the supply.');
        else if (f.id === 'cableCondition' || f.id === 'shutters') out.push('Damaged connector or socket recorded. Take the unit out of service.');
        else out.push(f.label);
      }
      if (f.type === 'meas' && verdict(f, k) === false) out.push(f.label + ' is outside the limit of ' + (f.min !== undefined ? 'minimum ' + f.min : 'maximum ' + f.max) + ' ' + (f.unit || ''));
    }); return [...new Set(out)]; }

    function renderAlerts() {
      const g = gates(), m = showMiss ? missing() : []; const host = elBy('alerts'); host.innerHTML = '';
      if (g.length) { const box = alertBox(true, false); const b = mk('b', { color: C.req, display: 'block', marginBottom: '5px', fontFamily: C.headFont }); b.textContent = 'Action required on site';
        const ul = mk('ul', { margin: '6px 0 0', paddingLeft: '20px', color: C.muted, fontSize: '13px' }); g.forEach(x => { const li = document.createElement('li'); li.textContent = x; ul.appendChild(li); }); box.append(b, ul); host.appendChild(box); }
      if (m.length) { const box = alertBox(false, false); const b = mk('b', { color: C.dark, display: 'block', marginBottom: '5px', fontFamily: C.headFont }); b.textContent = m.length + ' required question(s) outstanding';
        const ul = mk('ul', { margin: '6px 0 0', paddingLeft: '20px', color: C.muted, fontSize: '13px' }); m.slice(0, 8).forEach(x => { const li = document.createElement('li'); li.textContent = x.label; ul.appendChild(li); });
        if (m.length > 8) { const li = document.createElement('li'); li.textContent = 'and ' + (m.length - 8) + ' more'; ul.appendChild(li); } box.append(b, ul); host.appendChild(box); }
    }

    function submit() {
      showMiss = true; const m = missing();
      if (m.length) { page = m[0].page; seen.add(page); draw(); window.scrollTo(0, 0); toast(m.length + ' required question(s) outstanding'); return; }
      draw();
      const rows = []; let photos = 0, hidden = 0;
      walk((f, si, r) => { if (f.type === 'note') return; if (!visible(f, si, r)) { hidden++; return; } const k = key(si, f.id, r), v = V[k], tag = r !== undefined ? ' [' + (r + 1) + ']' : '';
        if (f.type === 'photo' || f.type === 'multiphoto') { photos += (v || []).length; return; }
        if (f.type === 'sig') { if (v) rows.push([f.label + tag, 'signed']); return; }
        if (f.type === 'charger') { if (v) rows.push(['Charge point' + tag, v + ' ' + (V[k + '_model'] || '') + (V[k + '_variant'] ? ', ' + V[k + '_variant'] : '')]); return; }
        if (f.type === 'meas') { if (V[k + '_lim']) rows.push([f.label + tag, 'LIM']); else if (v !== undefined && v !== '') rows.push([f.label + tag, v + ' ' + (f.unit || '')]); return; }
        if (f.type === 'multi') { if ((v || []).length) rows.push([f.label + tag, v.join(', ')]); return; }
        if (v !== undefined && v !== null && String(v).trim() !== '') rows.push([f.label + tag, String(v)]); });
      const ref = 'AJSE-' + form.ref + '-' + String(Math.floor(1 + Math.random() * 9999)).padStart(4, '0');
      const payload = { reference: ref, form: form.id, submitted_at: new Date().toISOString(), submitted_offline: !online, answered: rows.length, not_applicable: hidden, photo_count: photos, values: Object.fromEntries(rows.slice(0, 10)) };

      elBy('runner').style.display = 'none'; elBy('result').style.display = 'block';
      const out = mk('div', { background: C.white, border: '1px solid ' + C.line, borderRadius: C.radius + 'px', padding: '22px', boxShadow: C.shadowSm });
      const h2 = mk('h2', { margin: '0 0 4px', fontSize: '18px', color: C.dark, fontFamily: C.headFont, fontWeight: 700 }); h2.textContent = form.title + ' submitted';
      const sub = mk('div', { color: C.muted, margin: '0 0 4px', fontSize: '14px' }); sub.textContent = 'Reference ' + ref + '. ' + rows.length + ' answers, ' + hidden + ' questions did not apply, ' + photos + ' photos' + (online ? '' : ', queued on device') + '.';
      const dl = mk('dl', { display: 'grid', gridTemplateColumns: 'auto 1fr', gap: '6px 16px', margin: '14px 0 0', fontSize: '13px' });
      rows.slice(0, 14).forEach(([a, b]) => { const dt = mk('dt', { color: C.dark, fontWeight: 700 }); dt.textContent = a; const dd = mk('dd', { margin: 0 }); dd.textContent = b.length > 70 ? b.slice(0, 70) + '…' : b; dl.append(dt, dd); });
      out.append(h2, sub, dl);
      if (rows.length > 14) { const more = mk('div', { fontSize: '11px', color: C.faint, marginTop: '8px' }); more.textContent = 'and ' + (rows.length - 14) + ' more answers'; out.appendChild(more); }
      const pre = mk('pre', { background: '#f7f9fa', border: '1px solid ' + C.line, borderRadius: '5px', padding: '12px', fontSize: '11px', overflow: 'auto', maxHeight: '240px', marginTop: '14px' }); pre.textContent = JSON.stringify(payload, null, 2); out.appendChild(pre);
      elBy('result').innerHTML = ''; elBy('result').appendChild(out);
      if (!online) { queue++; net(); } window.scrollTo(0, 0);
    }

    // ---- shell markup ----
    root.innerHTML = `

        </span>
        <div style="font-size:13px;color:#cfe5ec;line-height:1.3;font-family:${C.bodyFont};font-weight:600">EV charging design, installation and maintenance</div>
        <a href="jobs.html" style="margin-left:auto;color:#a8d4de;font-size:13px;font-weight:600;text-decoration:none;font-family:${C.bodyFont}">&larr; Jobs</a>
        <div style="font-size:12px;color:#a8d4de;text-align:right;line-height:1.4;font-family:${C.bodyFont}">D. Whitmore<br>Engineer · ECS 4471902</div>
      </div>
      <div style="height:3px;background:linear-gradient(90deg,${C.blue},${C.dark})"></div>
      <div id="netbar" style="background:#fff;border-bottom:1px solid ${C.line};padding:8px 18px;display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap;font-family:${C.bodyFont}">
        <span id="dot" style="width:9px;height:9px;border-radius:50%;background:${C.ok}"></span><span id="netxt">Online</span>
        <span id="pill" style="display:none;background:${C.warnBg};border:1px solid ${C.warnLine};border-radius:5px;padding:2px 10px;color:${C.warn};font-size:12px"></span>
        <span style="margin-left:auto"></span>
        <button id="netbtn" style="background:none;border:1px solid ${C.line};border-radius:5px;padding:5px 11px;color:${C.ink};font-family:${C.bodyFont}">Go offline</button>
        <button id="syncbtn" style="display:none;background:none;border:1px solid ${C.line};border-radius:5px;padding:5px 11px;color:${C.ink};font-family:${C.bodyFont}">Sync now</button>
      </div>
      <main style="max-width:820px;margin:0 auto;padding:22px 18px">
        <div id="home">
          <h1 style="font-size:22px;color:${C.dark};margin:0 0 6px;font-family:${C.headFont};font-weight:700">Forms</h1>
          <p style="color:${C.muted};margin:0 0 20px;font-size:14px;font-family:${C.bodyFont}">Questions appear only where they apply to what is actually installed. Everything saves on the device first, so signal is not required.</p>
          <div id="picker"></div>
        </div>
        <div id="runner" style="display:none">
          <h1 id="ftitle" style="font-size:21px;color:${C.dark};margin:0 0 5px;font-family:${C.headFont};font-weight:700"></h1>
          <p id="fsub" style="color:${C.muted};margin:0 0 16px;font-size:14px;font-family:${C.bodyFont}"></p>
          <div id="rail" style="display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap"></div>
          <div id="alerts"></div>
          <div id="page"></div>
        </div>
        <div id="result" style="display:none"></div>
      </main>
      <footer style="border-top:3px solid ${C.blue};background:#fff;padding:20px 18px 88px">

          <div style="font-size:13px;color:${C.muted};line-height:1.5;font-family:${C.bodyFont}"><b style="color:${C.dark}">AJS Energy</b><br>Innovation House, 6 Cibus Way, Holbeach, PE12 7FH</div>
          <a href="https://ajsenergy.uk" style="margin-left:auto;color:${C.blue};font-size:13px;font-weight:700;text-decoration:none;font-family:${C.bodyFont}">ajsenergy.uk</a>
        </div>
      </footer>
      <div id="navbar" style="display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid ${C.line};padding:11px 16px;gap:10px;align-items:center;box-shadow:0 -3px 12px rgba(5,40,55,.08)">
        <button id="quit" style="background:none;border:1px solid ${C.line};border-radius:6px;padding:9px 15px;color:${C.dark};font-family:${C.bodyFont}">Menu</button>
        <div style="margin:0 auto;display:flex;gap:8px">
          <button id="prev" style="background:none;border:1px solid ${C.line};border-radius:6px;padding:9px 15px;color:${C.dark};font-family:${C.bodyFont}">Prev</button>
          <button id="next" style="background:none;border:1px solid ${C.line};border-radius:6px;padding:9px 15px;color:${C.dark};font-family:${C.bodyFont}">Next</button>
        </div>
        <button id="submit" style="background:${C.blue};color:#fff;border:none;font-weight:700;padding:11px 24px;border-radius:6px;font-family:${C.bodyFont}">Submit</button>
      </div>`;

    elBy('netbtn').onclick = () => { online = !online; net(); };
    elBy('syncbtn').onclick = () => { const n = queue; queue = 0; net(); toast(n + ' record(s) synced'); };
    elBy('quit').onclick = () => { elBy('runner').style.display = 'none'; elBy('result').style.display = 'none'; elBy('navbar').style.display = 'none'; elBy('home').style.display = 'block'; window.scrollTo(0, 0); };
    elBy('prev').onclick = () => { if (page > 0) { page--; seen.add(page); draw(); window.scrollTo(0, 0); } };
    elBy('next').onclick = () => { if (page < form.pages.length - 1) { page++; seen.add(page); draw(); window.scrollTo(0, 0); } };
    elBy('submit').onclick = () => submit();

    renderPicker(); net();
})();
</script>
