<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJS Energy - sign in</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --teal:#1886a1;--navy:#05618e;--mist:#e6ebed;
    --ink:#1c2b30;--line:#c7d3d6;--surface:#fff;--pale:#f4fafb;
    --danger:#b3261e;--dangerbg:#fdf3f2;
    --muted:#5d6c72;--faint:#8a959a;
    --r-sm:4px;--r-md:8px;--r-lg:16px;--r-pill:999px;
    --sh-sm:0 1px 2px rgba(5,40,50,.08);
    --sh-lg:0 24px 60px -12px rgba(2,20,28,.5);
    --glow:0 0 0 4px rgba(24,134,161,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100vh}
  body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;
       min-height:100vh;display:flex;flex-direction:column;
       background:radial-gradient(720px 480px at 18% -8%,rgba(24,134,161,.35),transparent 60%),
                  linear-gradient(165deg,#03212c 0%,#052a38 46%,#063347 100%);
       background-attachment:fixed}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  :focus-visible{outline:2px solid #5be3ff;outline-offset:2px;border-radius:var(--r-sm)}

  .brand{display:flex;align-items:center;justify-content:center;gap:10px;padding:28px 20px 4px}
  .brand .logo{display:block;height:36px;width:auto}
  .brand b{color:#eaf7fa;font-size:15px;font-weight:700;letter-spacing:.2px}
  .brand b span{color:#7fc3d1;font-weight:400}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 20px 44px}
  .card{position:relative;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);
        padding:32px 28px;width:100%;max-width:392px}
  .card::before{content:'';position:absolute;left:28px;right:28px;top:0;height:3px;border-radius:0 0 3px 3px;
        background:linear-gradient(90deg,var(--teal),#5be3ff)}
  .card h1{font-size:22px;color:var(--navy);margin:2px 0 4px;font-weight:800;letter-spacing:-.2px}
  .card .sub{color:var(--muted);margin:0 0 24px;font-size:13.5px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;font-weight:bold;color:var(--navy);margin-bottom:6px;
               text-transform:uppercase;letter-spacing:.3px}
  .field input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);
               font-size:15px;font-family:inherit;transition:border-color .15s,box-shadow .15s;background:var(--pale)}
  .field input:hover{border-color:#a8bcc0}
  .field input:focus{outline:none;border-color:var(--teal);box-shadow:var(--glow);background:var(--surface)}
  .btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:var(--r-md);
       padding:13px;font-weight:bold;font-size:15px;letter-spacing:.2px;
       box-shadow:0 8px 20px -6px rgba(24,134,161,.55);margin-top:6px;transition:background .15s,transform .1s}
  .btn:hover{background:var(--navy)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .switcher{display:flex;gap:4px;background:var(--mist);border-radius:var(--r-pill);
            padding:3px;margin-bottom:22px}
  .switcher button{flex:1;background:none;border:none;padding:9px;border-radius:7px;
                   font-size:13px;font-weight:bold;color:var(--muted);transition:background .15s,color .15s}
  .switcher button.on{background:var(--surface);color:var(--navy);box-shadow:var(--sh-sm)}
  .msg{font-size:13px;border-radius:var(--r-sm);padding:10px 12px;margin-bottom:14px;line-height:1.4}
  .msg.err{background:var(--dangerbg);color:var(--danger)}
  .msg.ok{background:#eafaf1;color:#1c7a4d}
  .foot{text-align:center;font-size:12px;color:#7fa8b3;margin-top:20px}
  .hidden{display:none}
  @media (max-width:380px){
    .card{padding:26px 20px;border-radius:12px}
    main{padding:14px 14px 32px}
  }
</style>

<div class="brand">
  <img class="logo" src="ajs-energy-logo.png" alt="AJS Energy">
</div>

<main>
  <div class="card">
    <div class="switcher">
      <button id="tab-in" class="on" type="button">Sign in</button>
      <button id="tab-up" type="button">Create account</button>
    </div>
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Job portal - staff only.</p>
    <div id="msg"></div>
    <form id="form">
      <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" minlength="6"></div>
      <div class="field hidden" id="nameField"><label for="fullName">Your name</label><input id="fullName" autocomplete="name"></div>
      <button class="btn" id="go" type="submit">Sign in</button>
    </form>
  </div>
</main>
<p class="foot">AJS Energy &middot; engineer and manager access only</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="db.js"></script>
<script>
(async function(){
  const supabase = sb;
  const el = id => document.getElementById(id);
  let mode = 'in';

  function setMode(m){
    mode = m;
    el('tab-in').classList.toggle('on', m==='in');
    el('tab-up').classList.toggle('on', m==='up');
    el('title').textContent = m==='in' ? 'Sign in' : 'Create account';
    el('subtitle').textContent = m==='in' ? 'Job portal - staff only.' : 'New accounts start as an engineer; a manager upgrades access afterwards.';
    el('nameField').classList.toggle('hidden', m!=='up');
    el('go').textContent = m==='in' ? 'Sign in' : 'Create account';
    el('msg').innerHTML = '';
  }
  el('tab-in').onclick = () => setMode('in');
  el('tab-up').onclick = () => setMode('up');

  // already signed in? skip straight to the jobs list
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'jobs.html';
  });

  el('form').onsubmit = async (e) => {
    e.preventDefault();
    const email = el('email').value.trim();
    const password = el('password').value;
    el('go').disabled = true;
    el('msg').innerHTML = '';

    if (mode === 'in') {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        el('msg').innerHTML = '<div class="msg err">'+error.message+'</div>';
        el('go').disabled = false;
        return;
      }
      window.location.href = 'jobs.html';
      return;
    }

    const { data, error } = await supabase.auth.signUp({
      email, password,
      options: { data: { full_name: el('fullName').value.trim() } }
    });
    el('go').disabled = false;
    if (error) {
      el('msg').innerHTML = '<div class="msg err">'+error.message+'</div>';
      return;
    }
    if (data.session) {
      window.location.href = 'jobs.html';
      return;
    }
    el('msg').innerHTML = '<div class="msg ok">Account created - check your email to confirm it, then sign in.</div>';
    setMode('in');
  };
})();
</script>
