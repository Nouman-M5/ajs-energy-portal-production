<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJS Energy - profile</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --teal:#1886a1;--navy:#05618e;--mist:#e6ebed;
    --ink:#1c2b30;--line:#c7d3d6;--surface:#fff;--pale:#f4fafb;
    --ok:#1c7a4d;--okbg:#eafaf1;--danger:#b3261e;--dangerbg:#fdf3f2;
    --muted:#5d6c72;--faint:#8a959a;
    --r-sm:4px;--r-md:8px;--r-lg:16px;--r-pill:999px;
    --sh-sm:0 1px 3px rgba(5,40,50,.08);
    --sh-md:0 4px 14px rgba(5,40,50,.14);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--mist);
       font-size:15px;line-height:1.5}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:var(--r-sm)}
  .topbar{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--teal),#136d82);
          color:#fff;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
          box-shadow:0 2px 10px rgba(3,30,40,.18)}
  .logospacer{width:104px;height:1px;flex:none}
  .logowrap{position:absolute;left:20px;top:7px;z-index:11;line-height:0}
  .logo{display:block;height:58px;width:auto;filter:drop-shadow(0 8px 10px rgba(2,20,28,.4))}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:#eaf6f9;font-size:13px;
            font-weight:600;text-decoration:none;padding:5px 8px;border-radius:var(--r-sm)}
  .backlink:hover{background:rgba(255,255,255,.1);color:#fff}
  .accent{height:3px;background:linear-gradient(90deg,var(--teal),#5be3ff)}
  main{max-width:460px;margin:0 auto;padding:38px 20px 60px}
  @media(max-width:480px){ .logo{height:46px} .logospacer{width:84px} main{padding-top:32px} }

  .card{background:var(--surface);border:1px solid #eaf0f1;border-radius:var(--r-lg);
        box-shadow:var(--sh-sm);padding:26px 24px}
  .avatar{width:64px;height:64px;border-radius:var(--r-pill);background:var(--navy);color:#fff;
          display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;
          margin:0 auto 14px}
  .name{text-align:center;font-size:18px;font-weight:800;color:var(--navy);margin:0}
  .email{text-align:center;font-size:13px;color:var(--faint);margin:3px 0 0}
  .badges{display:flex;justify-content:center;gap:6px;margin:12px 0 22px}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:4px 11px;
         font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .badge.role{background:#e3f1f5;color:var(--teal)}
  .badge.active{background:var(--okbg);color:var(--ok)}
  .badge.inactive{background:var(--dangerbg);color:var(--danger)}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:bold;color:var(--navy);margin-bottom:6px;
               text-transform:uppercase;letter-spacing:.3px}
  .field input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);
               font-size:15px;font-family:inherit;background:var(--pale)}
  .field input:focus{outline:none;border-color:var(--teal);background:var(--surface);
       box-shadow:0 0 0 4px rgba(24,134,161,.14)}
  .field input:disabled{color:var(--muted);cursor:not-allowed}

  .msg{font-size:13px;border-radius:var(--r-sm);padding:10px 12px;margin-bottom:14px;line-height:1.4}
  .msg.err{background:var(--dangerbg);color:var(--danger)}
  .msg.ok{background:var(--okbg);color:var(--ok)}

  .btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:var(--r-md);
       padding:12px;font-weight:bold;font-size:15px;box-shadow:0 6px 16px -4px rgba(24,134,161,.5);
       margin-top:4px;transition:background .15s}
  .btn:hover{background:var(--navy)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.danger{background:none;border:1.5px solid var(--line);color:var(--danger);box-shadow:none;margin-top:26px}
  .btn.danger:hover{background:var(--dangerbg)}
  .hidden{display:none}
</style>

<div class="topbar">
  <div class="logospacer"></div>
  <div class="logowrap"><img class="logo" src="ajs-energy-logo.png" alt="AJS Energy"></div>
  <a class="backlink" href="jobs.html">&larr;<span>Jobs</span></a>
</div>
<div class="accent"></div>

<main>
  <div class="card">
    <div class="avatar" id="avatar">?</div>
    <h1 class="name" id="pName">Loading...</h1>
    <p class="email" id="pEmail"></p>
    <div class="badges">
      <span class="badge role" id="pRole"></span>
      <span class="badge" id="pActive"></span>
    </div>

    <div id="msg"></div>
    <form id="form">
      <div class="field"><label for="fullName">Full name</label><input id="fullName"></div>
      <div class="field"><label for="ecs">ECS card number</label><input id="ecs" placeholder="Not set"></div>
      <button class="btn" id="save" type="submit">Save changes</button>
    </form>

    <button class="btn danger" id="signOutBtn" type="button">Sign out</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="db.js"></script>
<script>
(async function(){
  const supabase = sb;
  const el = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const session = await ajsRequireSession();
  if (!session) { throw new Error('redirecting to login'); }
  const me = await ajsGetMyProfile();
  if (!me) { await ajsSignOut(); throw new Error('no profile'); }

  function initials(name, email) {
    const src = (name || '').trim() || (email || '').split('@')[0];
    const parts = src.split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  function render() {
    el('avatar').textContent = initials(me.full_name, me.email);
    el('pName').textContent = me.full_name || '(no name set)';
    el('pEmail').textContent = me.email || session.user.email;
    el('pRole').textContent = me.role;
    el('pActive').textContent = me.active ? 'Active' : 'Inactive';
    el('pActive').className = 'badge ' + (me.active ? 'active' : 'inactive');
    el('fullName').value = me.full_name || '';
    el('ecs').value = me.ecs_card_no || '';
  }
  render();

  el('form').onsubmit = async (e) => {
    e.preventDefault();
    el('msg').innerHTML = '';
    el('save').disabled = true;
    const full_name = el('fullName').value.trim();
    const ecs_card_no = el('ecs').value.trim() || null;
    const { error } = await supabase.from('profiles').update({ full_name, ecs_card_no }).eq('id', me.id);
    el('save').disabled = false;
    if (error) { el('msg').innerHTML = '<div class="msg err">'+esc(error.message)+'</div>'; return; }
    me.full_name = full_name; me.ecs_card_no = ecs_card_no;
    render();
    el('msg').innerHTML = '<div class="msg ok">Saved.</div>';
  };

  el('signOutBtn').onclick = ajsSignOut;
})();
</script>
