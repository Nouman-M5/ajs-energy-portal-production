<style>
  :root{
    --teal:#1886a1;--navy:#05618e;--mist:#e6ebed;
    --ink:#1c2b30;--line:#c7d3d6;--surface:#fff;--pale:#f4fafb;
    --ok:#1c7a4d;--okbg:#eafaf1;--danger:#b3261e;--dangerbg:#fdf3f2;
    --hazard:#a15c00;--hazardbg:#fdf1d6;
    --muted:#5d6c72;--faint:#8a959a;
    --r-sm:4px;--r-md:8px;--r-lg:14px;--r-pill:999px;
    --sh-sm:0 1px 2px rgba(5,40,50,.08);
    --sh-md:0 4px 14px rgba(5,40,50,.14);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--mist);
       font-size:15px;line-height:1.5}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:var(--r-sm)}
  .topbar{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{display:block;height:40px;width:auto;flex:none}
  .brandtext{font-weight:bold;font-size:17px;letter-spacing:.4px;color:#fff}
  .brandtext span{color:#a8d4de;font-weight:normal}
  .who{margin-left:auto;font-size:13px;color:#eaf6f9;display:flex;align-items:center;gap:10px}
  .rolebadge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:var(--r-pill);
             padding:2px 10px;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.4px}
  .logout{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--r-sm);padding:6px 12px;font-size:12px}
  .logout:hover{background:rgba(255,255,255,.12)}
  .accent{height:3px;background:var(--teal)}
  main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:22px;color:var(--navy);margin:0 0 4px;font-weight:700}
  .sub{color:var(--muted);margin:0 0 20px;font-size:14px}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:var(--r-md);padding:10px 18px;
       font-weight:bold;box-shadow:var(--sh-sm)}
  .btn:hover{background:var(--navy)}
  .btn.ghost{background:none;color:var(--navy);border:1px solid var(--line);font-weight:normal;box-shadow:none}

  .newjob{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
          box-shadow:var(--sh-md);padding:18px 20px;margin-bottom:20px}
  .newjob h2{margin:0 0 14px;font-size:15px;color:var(--navy)}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
  @media(max-width:720px){.grid3{grid-template-columns:1fr}}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:bold;color:var(--navy);margin-bottom:4px}
  .field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);
       font-size:14px;font-family:inherit}
  .newjob .row{display:flex;gap:10px;justify-content:flex-end}

  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r-md);
        overflow:hidden;box-shadow:var(--sh-sm)}
  thead th{background:var(--pale);text-align:left;font-size:12px;color:var(--navy);text-transform:uppercase;
            letter-spacing:.3px;padding:10px 12px;border-bottom:1px solid var(--line)}
  tbody td{padding:11px 12px;border-bottom:1px solid #eef2f3;font-size:13px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--pale)}
  .ref{font-weight:bold;color:var(--navy)}
  .muted{color:var(--muted)}
  .pill{display:inline-block;border-radius:var(--r-pill);padding:2px 10px;font-size:11px;font-weight:bold;
        text-transform:uppercase;letter-spacing:.3px}
  .pill.new{background:var(--mist);color:var(--muted)}
  .pill.assigned{background:#e3f1f5;color:var(--teal)}
  .pill.in_progress{background:#dcecef;color:var(--navy)}
  .pill.submitted{background:var(--okbg);color:var(--ok)}
  .pill.reviewed{background:var(--pale);color:var(--faint)}
  select.assign{padding:5px 7px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:12px;
                font-family:inherit;background:var(--surface)}
  .startlink{font-size:12px;color:var(--teal);text-decoration:none;font-weight:bold}
  .startlink:hover{text-decoration:underline}
  .empty{border:1px dashed var(--line);border-radius:var(--r-md);padding:30px;text-align:center;
         color:var(--muted);background:var(--surface)}
  .hint{font-size:12px;color:var(--faint);margin-top:14px}
  .hidden{display:none}
</style>

<div class="topbar">
  <svg class="logo" viewBox="0 0 180 124" role="img" aria-label="AJS"><rect x="0" y="0" width="56" height="124" fill="#005F8C"></rect><rect x="62" y="0" width="56" height="124" fill="#005F8C"></rect><rect x="124" y="0" width="56" height="124" fill="#005F8C"></rect><path d="M4,88 L23,36 L33,36 L52,88 L41.5,88 L38.6,72 L17.4,72 L14.5,88 Z M28,45 L22,63 L34,63 Z" fill="#ffffff" fill-rule="evenodd"></path><path d="M108,36 L108,70 C108,80.5 100,88 89,88 C79,88 72,82 70,73 L80.5,70 C82,76 85,79 89,79 C94,79 96.5,75.5 96.5,70 L96.5,36 Z" fill="#ffffff"></path><path d="M165,43.5 L165,49 A13,13 0 1 0 152,62 A13,13 0 1 1 139,75 L139,80.5" fill="none" stroke="#ffffff" stroke-width="11.5"></path></svg>
  <div class="brandtext">AJS <span>Energy</span></div>
  <div class="who">
    <span id="whoName"></span><span class="rolebadge" id="whoRole"></span>
    <button class="logout" id="logoutBtn" type="button">Sign out</button>
  </div>
</div>
<div class="accent"></div>

<main>
  <h1 id="pageTitle">Jobs</h1>
  <p class="sub" id="pageSub"></p>

  <div class="toolbar">
    <span></span>
    <button class="btn hidden" id="newJobBtn" type="button">+ New job</button>
  </div>

  <div class="newjob hidden" id="newJobPanel">
    <h2>New job</h2>
    <div class="grid3">
      <div class="field"><label>Reference</label><input id="nj-ref"></div>
      <div class="field"><label>Form type</label>
        <select id="nj-type">
          <option value="site-validation">Site validation</option>
          <option value="safety-inspection">Safety inspection</option>
          <option value="civils">Civils</option>
          <option value="enquiry">Client enquiry</option>
        </select>
      </div>
      <div class="field"><label>Assign to</label><select id="nj-assign"><option value="">Unassigned</option></select></div>
      <div class="field"><label>Client</label><input id="nj-client"></div>
      <div class="field"><label>Site name</label><input id="nj-site"></div>
      <div class="field"><label>Due date</label><input id="nj-due" type="date"></div>
    </div>
    <div class="field"><label>Site address</label><input id="nj-addr"></div>
    <div class="row">
      <button class="btn ghost" id="nj-cancel" type="button">Cancel</button>
      <button class="btn" id="nj-save" type="button">Create job</button>
    </div>
  </div>

  <div id="listHost"></div>
  <p class="hint" id="wiringHint"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="db.js"></script>
<script>
(async function(){
  const supabase = sb;
  const requireSession = ajsRequireSession;
  const getMyProfile = ajsGetMyProfile;
  const signOut = ajsSignOut;

  const el = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const FORM_FILE = { 'site-validation':'ajs_engineer_forms.html', 'safety-inspection':'ajs_engineer_forms.html',
                       'civils':'ajs_engineer_forms.html', 'enquiry':'ajs_energy_client_selector_v3.html' };
  const FORM_LABEL = { 'site-validation':'Site validation', 'safety-inspection':'Safety inspection',
                        'civils':'Civils', 'enquiry':'Client enquiry' };

  const session = await requireSession();
  if (!session) { throw new Error('redirecting to login'); }
  const me = await getMyProfile();
  if (!me) { await signOut(); throw new Error('no profile'); }

  el('whoName').textContent = me.full_name || session.user.email;
  el('whoRole').textContent = me.role;
  el('logoutBtn').onclick = signOut;

  const isManager = me.role === 'manager';
  el('pageTitle').textContent = isManager ? 'All jobs' : 'My jobs';
  el('pageSub').textContent = isManager
    ? 'Every job across the team. Assign, reassign, or add a new one.'
    : 'Jobs assigned to you. Opening a form here does not yet pre-fill or submit against the job - that wiring is next.';
  el('wiringHint').textContent = 'Note: "Start form" opens the tool standalone for now - it isn\'t yet linked to a specific job record.';

  let engineers = [];
  if (isManager) {
    const { data } = await supabase.from('profiles').select('id, full_name').eq('role', 'engineer').eq('active', true).order('full_name');
    engineers = data || [];
    el('newJobBtn').classList.remove('hidden');
  }

  function assignOptions(selectedId) {
    return '<option value="">Unassigned</option>' +
      engineers.map(en => '<option value="'+en.id+'"'+(en.id===selectedId?' selected':'')+'>'+esc(en.full_name||'(unnamed)')+'</option>').join('');
  }

  async function loadJobs() {
    let q = supabase.from('jobs').select('*').order('created_at', { ascending: false });
    if (!isManager) q = q.eq('assigned_to', me.id);
    const { data, error } = await q;
    if (error) { el('listHost').innerHTML = '<div class="empty">Could not load jobs: '+esc(error.message)+'</div>'; return; }
    render(data || []);
  }

  function render(jobs) {
    if (!jobs.length) {
      el('listHost').innerHTML = '<div class="empty">'+(isManager ? 'No jobs yet - create the first one above.' : 'Nothing assigned to you yet.')+'</div>';
      return;
    }
    const rows = jobs.map(j => {
      const assignCell = isManager
        ? '<select class="assign" data-job="'+j.id+'">'+assignOptions(j.assigned_to)+'</select>'
        : esc(me.full_name || '-');
      return '<tr>'+
        '<td class="ref">'+esc(j.reference)+'</td>'+
        '<td>'+esc(j.site_name||'-')+'<div class="muted">'+esc(j.client||'')+'</div></td>'+
        '<td>'+esc(FORM_LABEL[j.form_type]||j.form_type)+'</td>'+
        '<td><span class="pill '+j.status+'">'+esc(j.status.replace('_',' '))+'</span></td>'+
        '<td>'+assignCell+'</td>'+
        '<td><a class="startlink" href="'+FORM_FILE[j.form_type]+'" target="_blank" rel="noopener">Start form &rarr;</a></td>'+
        '</tr>';
    }).join('');
    el('listHost').innerHTML =
      '<table><thead><tr><th>Reference</th><th>Site / client</th><th>Type</th><th>Status</th><th>Assigned to</th><th></th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table>';

    if (isManager) {
      el('listHost').querySelectorAll('select.assign').forEach(sel => {
        sel.onchange = async () => {
          const jobId = sel.dataset.job;
          const newAssignee = sel.value || null;
          const { error } = await supabase.from('jobs')
            .update({ assigned_to: newAssignee, status: newAssignee ? 'assigned' : 'new' })
            .eq('id', jobId);
          if (error) { alert('Could not reassign: ' + error.message); }
          loadJobs();
        };
      });
    }
  }

  function genReference(type) {
    const codes = { 'site-validation':'SV', 'safety-inspection':'SI', 'civils':'Q', 'enquiry':'ENQ' };
    const n = String(Math.floor(1 + Math.random() * 9999)).padStart(4, '0');
    return 'AJSE-' + (codes[type]||'JOB') + '-' + n;
  }

  if (isManager) {
    el('nj-assign').innerHTML = assignOptions(null);
    el('nj-ref').value = genReference(el('nj-type').value);
    el('nj-type').onchange = () => { el('nj-ref').value = genReference(el('nj-type').value); };
    el('newJobBtn').onclick = () => el('newJobPanel').classList.remove('hidden');
    el('nj-cancel').onclick = () => el('newJobPanel').classList.add('hidden');
    el('nj-save').onclick = async () => {
      const payload = {
        reference: el('nj-ref').value.trim(),
        form_type: el('nj-type').value,
        client: el('nj-client').value.trim() || null,
        site_name: el('nj-site').value.trim() || null,
        site_address: el('nj-addr').value.trim() || null,
        due_date: el('nj-due').value || null,
        assigned_to: el('nj-assign').value || null,
        status: el('nj-assign').value ? 'assigned' : 'new',
        created_by: me.id
      };
      if (!payload.reference) { alert('Reference is required'); return; }
      const { error } = await supabase.from('jobs').insert(payload);
      if (error) { alert('Could not create job: ' + error.message); return; }
      el('newJobPanel').classList.add('hidden');
      ['nj-client','nj-site','nj-addr','nj-due'].forEach(id => el(id).value = '');
      el('nj-ref').value = genReference(el('nj-type').value);
      loadJobs();
    };
  }

  loadJobs();
})();
</script>
