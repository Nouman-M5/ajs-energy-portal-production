<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJS Energy - jobs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --teal:#1886a1;--navy:#05618e;--mist:#e6ebed;
    --ink:#1c2b30;--line:#c7d3d6;--surface:#fff;--pale:#f4fafb;
    --ok:#1c7a4d;--okbg:#eafaf1;--danger:#b3261e;--dangerbg:#fdf3f2;
    --hazard:#a15c00;--hazardbg:#fdf1d6;
    --muted:#5d6c72;--faint:#8a959a;
    --r-sm:4px;--r-md:8px;--r-lg:14px;--r-pill:999px;
    --sh-sm:0 1px 2px rgba(5,40,50,.08);
    --sh-md:0 4px 14px rgba(5,40,50,.14);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--mist);
       font-size:15px;line-height:1.5}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:var(--r-sm)}
  .topbar{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--teal),#136d82);
          color:#fff;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
          box-shadow:0 2px 10px rgba(3,30,40,.18)}
  /* logo is taken out of flow so its true (tall) aspect ratio can render at readable size -
     the header bar stays thin and the wordmark hangs down over the page background below it,
     matching the ajsenergy.uk site treatment */
  .logospacer{width:104px;height:1px;flex:none}
  .logowrap{position:absolute;left:20px;top:7px;z-index:11;line-height:0}
  .logo{display:block;height:58px;width:auto;filter:drop-shadow(0 8px 10px rgba(2,20,28,.4))}
  .who{margin-left:auto;font-size:13px;color:#eaf6f9;display:flex;align-items:center;gap:10px}
  .who a:hover{text-decoration:underline!important}
  .rolebadge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:var(--r-pill);
             padding:2px 10px;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.4px}
  .logout{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--r-sm);padding:6px 12px;font-size:12px;transition:background .15s}
  .logout:hover{background:rgba(255,255,255,.12)}
  .accent{height:3px;background:linear-gradient(90deg,var(--teal),#5be3ff)}
  main{max-width:1080px;margin:0 auto;padding:38px 20px 60px}
  @media(max-width:480px){
    .logo{height:46px}
    .logospacer{width:84px}
    main{padding-top:32px}
  }
  h1{font-size:23px;color:var(--navy);margin:0 0 4px;font-weight:800;letter-spacing:-.2px}
  .sub{color:var(--muted);margin:0 0 22px;font-size:14px;max-width:56ch}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:var(--r-md);padding:10px 18px;
       font-weight:bold;box-shadow:0 6px 16px -4px rgba(24,134,161,.5);transition:background .15s}
  .btn:hover{background:var(--navy)}
  .btn.ghost{background:none;color:var(--navy);border:1px solid var(--line);font-weight:normal;box-shadow:none}

  .newjob{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
          box-shadow:var(--sh-md);padding:20px 22px;margin-bottom:22px}
  .newjob h2{margin:0 0 16px;font-size:15px;color:var(--navy);font-weight:800}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
  @media(max-width:720px){.grid3{grid-template-columns:1fr}}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:bold;color:var(--navy);margin-bottom:5px;
               text-transform:uppercase;letter-spacing:.3px}
  .field input,.field select{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:var(--r-sm);
       font-size:15px;font-family:inherit;background:var(--pale)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--teal);background:var(--surface);
       box-shadow:0 0 0 4px rgba(24,134,161,.14)}
  .newjob .row{display:flex;gap:10px;justify-content:flex-end}
  @media(max-width:480px){.newjob .row{flex-direction:column}.newjob .row .btn{width:100%}}

  .muted{color:var(--muted)}
  .pill{display:inline-block;border:none;border-radius:var(--r-pill);padding:3px 10px;font-size:11px;font-weight:bold;
        text-transform:uppercase;letter-spacing:.3px}
  .msg{font-size:13px;border-radius:var(--r-sm);padding:10px 12px;margin-bottom:14px;line-height:1.4}
  .msg.err{background:var(--dangerbg);color:var(--danger)}
  .msg.ok{background:var(--okbg);color:var(--ok)}
  .pill.new{background:var(--mist);color:var(--muted)}
  .pill.assigned{background:#e3f1f5;color:var(--teal)}
  .pill.in_progress{background:var(--hazardbg);color:var(--hazard)}
  .pill.submitted{background:var(--okbg);color:var(--ok)}
  .pill.reviewed{background:var(--pale);color:var(--faint)}
  select.assign{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:12px;
                font-family:inherit;background:var(--surface)}
  .startlink{font-size:12.5px;color:var(--teal);text-decoration:none;font-weight:bold;white-space:nowrap}
  .startlink:hover{text-decoration:underline}
  .empty{border:1px dashed var(--line);border-radius:var(--r-md);padding:34px 20px;text-align:center;
         color:var(--muted);background:var(--surface)}
  .empty b{display:block;color:var(--navy);font-size:14px;margin-bottom:4px}
  .hint{font-size:12px;color:var(--faint);margin-top:14px}
  .hidden{display:none}

  /* search + status chips, filtering the already-loaded list client-side */
  .searchrow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .searchbox{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--surface);
             border:1px solid var(--line);border-radius:10px;padding:0 12px}
  .searchbox svg{flex:none;color:var(--faint)}
  .searchbox input{border:none;outline:none;background:none;font-size:13.5px;width:100%;
                    font-family:inherit;color:var(--ink);padding:10px 0}
  .chiprow{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px;padding-bottom:2px}
  .chip{flex:none;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;
        border:1px solid var(--line);background:var(--surface);color:var(--muted)}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}

  /* job cards - one layout for every screen size, no separate mobile table hack needed */
  .jobslist{display:flex;flex-direction:column;gap:12px}
  .jobcard{background:var(--surface);border:1px solid #eaf0f1;border-radius:16px;padding:16px;
           box-shadow:0 1px 3px rgba(5,40,50,.07);display:flex;flex-direction:column;gap:12px}
  .jobcard .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .jobcard .refnum{font-weight:800;font-size:13px;color:var(--teal);letter-spacing:.2px;white-space:nowrap}
  .jobcard .site{font-size:15px;font-weight:700;color:var(--navy)}
  .jobcard .client{font-size:12.5px;color:var(--faint);margin-top:1px}
  .typerow{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .typerow svg{color:var(--faint)}
  .ownerline{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .ownerline b{color:var(--navy)}
  .ownersel{padding:3px 6px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:12px;
            font-family:inherit;background:var(--surface);color:var(--navy)}
  .divider{height:1px;background:#eef2f3}
  .row3{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .assigneepill{display:flex;align-items:center;gap:8px;min-width:0}
  .avatarsm{width:22px;height:22px;border-radius:999px;background:#e3f1f5;color:var(--teal);
            display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;flex:none}
  .avatarsm.unassigned{background:var(--mist);color:var(--faint)}

  /* multi-engineer assignment: pills showing who's on a job, plus an editable checkbox panel */
  .assigneepills{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .apill{display:inline-flex;align-items:center;gap:5px;background:#e3f1f5;color:var(--teal);
         border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;font-weight:600}
  .apill .av{width:16px;height:16px;border-radius:999px;background:var(--teal);color:#fff;
             display:flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:800}
  .apill.unassigned{background:var(--mist);color:var(--faint);padding:3px 10px}
  .assignedit{background:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px;
              font-size:11.5px;color:var(--navy)}
  .assigneechecks{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-top:8px;
                   background:var(--pale);display:flex;flex-direction:column;gap:6px}
  .assigneechecks label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer}
  .assigneechecks .empty2{font-size:12.5px;color:var(--faint)}

  /* team member rows */
  .teamlist{display:flex;flex-direction:column;gap:10px}
  .teamrow{background:var(--surface);border:1px solid #eaf0f1;border-radius:14px;padding:14px;
           display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(5,40,50,.06)}
  .avatarmd{width:38px;height:38px;border-radius:999px;background:var(--navy);color:#fff;
            display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
  .teamwho{flex:1;min-width:120px}
  .teamwho .tname{font-size:14px;font-weight:700;color:var(--navy)}
  .teamwho .temail{font-size:12px;color:var(--faint);margin-top:1px}
  .teamctl{display:flex;align-items:center;gap:8px;flex:none}
</style>

<div class="topbar">
  <div class="logospacer"></div>
  <div class="logowrap"><img class="logo" src="ajs-energy-logo.png" alt="AJS Energy"></div>
  <div class="who">
    <a href="profile.html" id="whoName" title="View and edit your profile" style="color:inherit;text-decoration:none;font-weight:700"></a><span class="rolebadge" id="whoRole"></span>
    <button class="logout" id="logoutBtn" type="button">Sign out</button>
  </div>
</div>
<div class="accent"></div>

<main>
  <h1 id="pageTitle">Jobs</h1>
  <p class="sub" id="pageSub"></p>

  <div class="toolbar">
    <button class="btn ghost hidden" id="teamBtn" type="button">Manage team</button>
    <button class="btn hidden" id="newJobBtn" type="button">+ New job</button>
  </div>

  <div class="newjob hidden" id="teamPanel">
    <h2>Team</h2>
    <div id="teamMsg"></div>
    <div class="grid3">
      <div class="field"><label>Full name</label><input id="inv-name" placeholder="Jane Smith"></div>
      <div class="field"><label>Email</label><input id="inv-email" type="email" placeholder="jane@ajsenergy.uk"></div>
      <div class="field"><label>&nbsp;</label><button class="btn" id="inv-send" type="button" style="width:100%">Send invite</button></div>
    </div>
    <p class="hint" style="margin:-6px 0 16px">They get an email with a link to set their own password and sign in - no password to share. New accounts start as an engineer under you; an admin can change roles if needed.</p>
    <div id="teamListHost"></div>
  </div>

  <div class="newjob hidden" id="newJobPanel">
    <h2>New job</h2>
    <div class="grid3">
      <div class="field"><label>Reference</label><input id="nj-ref"></div>
      <div class="field"><label>Form type</label>
        <select id="nj-type">
          <option value="site-validation">Site validation</option>
          <option value="safety-inspection">Safety inspection</option>
          <option value="civils">Civils</option>
          <option value="enquiry">Client enquiry</option>
        </select>
      </div>
      <div class="field"><label>Assign to</label><div id="nj-assign" class="assigneechecks"></div></div>
      <div class="field"><label>Client</label><input id="nj-client"></div>
      <div class="field"><label>Site name</label><input id="nj-site"></div>
      <div class="field"><label>Due date</label><input id="nj-due" type="date"></div>
    </div>
    <div class="field"><label>Site address</label><input id="nj-addr"></div>
    <div class="row">
      <button class="btn ghost" id="nj-cancel" type="button">Cancel</button>
      <button class="btn" id="nj-save" type="button">Create job</button>
    </div>
  </div>

  <div class="searchrow">
    <div class="searchbox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="jobSearch" type="search" placeholder="Search jobs by reference, site or client">
    </div>
  </div>
  <div class="chiprow" id="chipRow"></div>

  <div id="listHost"></div>
  <p class="hint" id="wiringHint"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="db.js"></script>
<script>
(async function(){
  const supabase = sb;
  const requireSession = ajsRequireSession;
  const getMyProfile = ajsGetMyProfile;
  const signOut = ajsSignOut;

  const el = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const FORM_FILE = { 'site-validation':'ajs_energy_engineer_forms.html', 'safety-inspection':'ajs_energy_engineer_forms.html',
                       'civils':'ajs_energy_engineer_forms.html', 'enquiry':'ajs_energy_enquiry_form.html' };
  const FORM_LABEL = { 'site-validation':'Site validation', 'safety-inspection':'Safety inspection',
                        'civils':'Civils', 'enquiry':'Client enquiry' };

  const session = await requireSession();
  if (!session) { throw new Error('redirecting to login'); }
  const me = await getMyProfile();
  if (!me) { await signOut(); throw new Error('no profile'); }

  el('whoName').textContent = me.full_name || session.user.email;
  el('whoRole').textContent = me.role;
  el('logoutBtn').onclick = signOut;

  // three tiers: an engineer only ever sees their own jobs; a manager sees jobs they created
  // plus jobs assigned to engineers they manage; an admin sees everything company-wide. The
  // actual row filtering happens in Postgres RLS (internal.visible_job_ids()) - isAdmin/isManager
  // here only drive which buttons and controls this page shows, they're not a security boundary.
  const isAdmin = me.role === 'admin';
  const isManager = me.role === 'manager';
  const isStaff = isAdmin || isManager;
  el('pageTitle').textContent = isAdmin ? 'All jobs' : isManager ? 'My team\'s jobs' : 'My jobs';
  el('pageSub').textContent = isAdmin
    ? 'Every job across the whole company.'
    : isManager
      ? 'Jobs you created, or jobs assigned to engineers you manage.'
      : 'Jobs assigned to you. Opening a form here does not yet pre-fill or submit against the job - that wiring is next.';
  el('wiringHint').textContent = 'Note: "Start form" opens the tool standalone for now - it isn\'t yet linked to a specific job record.';

  let engineers = [], managers = [];
  async function reloadEngineers() {
    // a manager only ever assigns/invites their own engineers; an admin can assign anyone active
    let q = supabase.from('profiles').select('id, full_name').eq('role', 'engineer').eq('active', true).order('full_name');
    if (!isAdmin) q = q.eq('manager_id', me.id);
    const { data } = await q;
    engineers = data || [];
  }
  async function reloadManagers() {
    // for the job-ownership transfer control - any manager/admin (see profiles_select_scoped:
    // managers and admins can always see each other, specifically to support this)
    const { data } = await supabase.from('profiles').select('id, full_name, role').in('role', ['manager', 'admin']).order('full_name');
    managers = data || [];
  }

  if (isStaff) {
    await reloadEngineers();
    await reloadManagers();
    el('newJobBtn').classList.remove('hidden');
    el('teamBtn').classList.remove('hidden');
  }

  // multi-engineer assignment: a job can now have any number of assignees (job_assignees
  // junction table), not just one. This renders the checkbox list used both in the new-job
  // panel and in each job card's "Edit" panel.
  function renderAssigneeChecks(host, selectedIds) {
    if (!engineers.length) { host.innerHTML = '<span class="empty2">No active engineers yet - add one under Manage team.</span>'; return; }
    host.innerHTML = engineers.map(en =>
      '<label><input type="checkbox" value="'+en.id+'"'+(selectedIds.includes(en.id)?' checked':'')+'>'+esc(en.full_name||'(unnamed)')+'</label>'
    ).join('');
  }
  function checkedIds(host) {
    return [...host.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
  }

  const STATUS_LABELS = { new:'New', assigned:'Assigned', in_progress:'In progress', submitted:'Submitted', reviewed:'Reviewed' };
  const STATUS_ORDER = ['new','assigned','in_progress','submitted','reviewed'];
  const ICO_CASE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 7h16v13H4z" stroke="currentColor" stroke-width="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="2"/></svg>';
  const initialsOf = name => {
    const parts = (name || '').trim().split(/\s+/).filter(Boolean);
    return parts.length ? (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase() : '?';
  };

  let allJobs = [], searchQ = '', statusFilter = 'all', expandedAssign = new Set();

  async function loadJobs() {
    // job_assignees is the source of truth for who can see/work a job now (a job can have
    // several engineers on it) - RLS on `jobs` already restricts an engineer to only the rows
    // they're in job_assignees for, so there's no client-side filter needed here any more.
    const { data, error } = await supabase.from('jobs')
      .select('*, owner:profiles!jobs_created_by_fkey(full_name), job_assignees(engineer_id, profiles(full_name))')
      .order('created_at', { ascending: false });
    if (error) { el('listHost').innerHTML = '<div class="empty">Could not load jobs: '+esc(error.message)+'</div>'; return; }
    allJobs = data || [];
    renderChips();
    renderList();
  }

  function renderChips() {
    const chips = [['all','All']].concat(STATUS_ORDER.map(s => [s, STATUS_LABELS[s]]));
    el('chipRow').innerHTML = chips.map(([key, label]) => {
      const count = key === 'all' ? allJobs.length : allJobs.filter(j => j.status === key).length;
      return '<button type="button" class="chip'+(statusFilter===key?' on':'')+'" data-filter="'+key+'">'+label+' ('+count+')</button>';
    }).join('');
    el('chipRow').querySelectorAll('.chip').forEach(b => {
      b.onclick = () => { statusFilter = b.dataset.filter; renderChips(); renderList(); };
    });
  }

  function renderList() {
    const q = searchQ.toLowerCase();
    const jobs = allJobs.filter(j => {
      if (statusFilter !== 'all' && j.status !== statusFilter) return false;
      if (q && !(j.reference+' '+(j.site_name||'')+' '+(j.client||'')).toLowerCase().includes(q)) return false;
      return true;
    });
    render(jobs);
  }
  el('jobSearch').oninput = e => { searchQ = e.target.value.trim(); renderList(); };

  function render(jobs) {
    if (!allJobs.length) {
      el('listHost').innerHTML = isStaff
        ? '<div class="empty"><b>No jobs yet</b>Create the first one above and assign it to an engineer.</div>'
        : '<div class="empty"><b>Nothing assigned to you yet</b>Your manager will assign jobs here as they come in.</div>';
      return;
    }
    if (!jobs.length) {
      el('listHost').innerHTML = '<div class="empty"><b>No matches</b>Try a different search term or filter.</div>';
      return;
    }
    const cards = jobs.map(j => {
      // only the job's owning manager (or an admin) can edit who's assigned or transfer
      // ownership - a manager who merely oversees an assigned engineer can see the job but
      // not edit it, matching the jobs_update_owner_or_admin / job_assignees_write_owner_or_admin
      // RLS rules on the database side.
      const canEdit = isAdmin || (isManager && j.created_by === me.id);
      const assignees = j.job_assignees || [];
      const pills = assignees.length
        ? assignees.map(a => {
            const name = (a.profiles && a.profiles.full_name) || '(unnamed)';
            return '<span class="apill"><span class="av">'+esc(initialsOf(name))+'</span>'+esc(name)+'</span>';
          }).join('')
        : '<span class="apill unassigned">Unassigned</span>';
      const editBtn = canEdit ? '<button type="button" class="assignedit" data-job="'+j.id+'">Edit</button>' : '';
      const panel = (canEdit && expandedAssign.has(j.id))
        ? '<div class="assigneechecks" data-panel="'+j.id+'"></div>' : '';
      const ownerName = (j.owner && j.owner.full_name) || '(unknown)';
      const ownerLine = isStaff
        ? (canEdit
            ? '<div class="ownerline">Owner <select class="ownersel" data-job="'+j.id+'">' +
              managers.map(m => '<option value="'+m.id+'"'+(m.id===j.created_by?' selected':'')+'>'+esc(m.full_name||'(unnamed)')+(m.role==='admin'?' (admin)':'')+'</option>').join('') +
              '</select></div>'
            : '<div class="ownerline">Owner <b>'+esc(ownerName)+'</b></div>')
        : '';
      return '<div class="jobcard">' +
        '<div class="row1"><span class="refnum">'+esc(j.reference)+'</span>' +
        '<span class="pill '+j.status+'">'+esc(STATUS_LABELS[j.status] || j.status)+'</span></div>' +
        '<div><div class="site">'+esc(j.site_name || 'Site not set')+'</div>' +
        (j.client ? '<div class="client">'+esc(j.client)+'</div>' : '') + '</div>' +
        '<div class="typerow">'+ICO_CASE+'<span>'+esc(FORM_LABEL[j.form_type]||j.form_type)+'</span></div>' +
        ownerLine +
        '<div class="divider"></div>' +
        '<div class="row3">' +
          '<div class="assigneepills">'+pills+editBtn+'</div>' +
          '<a class="startlink" href="'+FORM_FILE[j.form_type]+'">Start form &rarr;</a>' +
        '</div>' +
        panel +
      '</div>';
    }).join('');
    el('listHost').innerHTML = '<div class="jobslist">'+cards+'</div>';

    if (isStaff) {
      // fill in any expanded assignment panels with the live checkbox list
      el('listHost').querySelectorAll('[data-panel]').forEach(host => {
        const job = jobs.find(x => x.id === host.dataset.panel);
        const selectedIds = (job.job_assignees || []).map(a => a.engineer_id);
        renderAssigneeChecks(host, selectedIds);
        host.querySelectorAll('input[type=checkbox]').forEach(cb => {
          cb.onchange = () => saveAssignees(job, checkedIds(host));
        });
      });
      el('listHost').querySelectorAll('.assignedit').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.job;
          if (expandedAssign.has(id)) expandedAssign.delete(id); else expandedAssign.add(id);
          renderList();
        };
      });
      el('listHost').querySelectorAll('.ownersel').forEach(sel => {
        sel.onchange = async () => {
          const { error } = await supabase.from('jobs').update({ created_by: sel.value }).eq('id', sel.dataset.job);
          if (error) { alert('Could not transfer ownership: ' + error.message); }
          loadJobs();
        };
      });
    }
  }

  async function saveAssignees(job, newIds) {
    const before = new Set((job.job_assignees || []).map(a => a.engineer_id));
    const after = new Set(newIds);
    const toAdd = newIds.filter(id => !before.has(id));
    const toRemove = [...before].filter(id => !after.has(id));
    if (toAdd.length) {
      const { error } = await supabase.from('job_assignees')
        .insert(toAdd.map(engineer_id => ({ job_id: job.id, engineer_id })));
      if (error) { alert('Could not add assignee: ' + error.message); return; }
    }
    if (toRemove.length) {
      const { error } = await supabase.from('job_assignees')
        .delete().eq('job_id', job.id).in('engineer_id', toRemove);
      if (error) { alert('Could not remove assignee: ' + error.message); return; }
    }
    // only auto-flip status between the two "nobody's started yet" states - never downgrade
    // a job that's already in_progress/submitted/reviewed just because assignees changed
    if (job.status === 'new' && after.size > 0) {
      await supabase.from('jobs').update({ status: 'assigned' }).eq('id', job.id);
    } else if (job.status === 'assigned' && after.size === 0) {
      await supabase.from('jobs').update({ status: 'new' }).eq('id', job.id);
    }
    loadJobs();
  }

  async function loadTeam() {
    // a manager only manages their own invited engineers; an admin sees and manages everyone
    let q = supabase.from('profiles').select('id, full_name, email, role, active, manager_id').order('full_name');
    if (!isAdmin) q = q.eq('manager_id', me.id);
    const { data, error } = await q;
    if (error) { el('teamListHost').innerHTML = '<div class="empty">Could not load team: '+esc(error.message)+'</div>'; return; }
    renderTeam(data || []);
  }

  function renderTeam(rows) {
    if (!rows.length) {
      el('teamListHost').innerHTML = isAdmin
        ? '<div class="empty">No team members yet.</div>'
        : '<div class="empty">You haven\'t invited any engineers yet - use the form above.</div>';
      return;
    }
    const cards = rows.map(p => {
      // role changes are admin-only (a manager promoting/demoting anyone, including engineers
      // they invited, is out of scope now that admin is the top tier) - and even an admin can't
      // edit their OWN role here, since that's exactly how this account got accidentally
      // self-demoted from manager to engineer earlier.
      const isSelf = p.id === me.id;
      const roleCtl = isAdmin
        ? '<select class="assign teamrole" data-id="'+p.id+'"'+(isSelf?' disabled title="You can\'t change your own role here"':'')+'>' +
          ['engineer','manager','admin'].map(r => '<option value="'+r+'"'+(p.role===r?' selected':'')+'>'+r+'</option>').join('') +
          '</select>'
        : '<span class="pill assigned">'+esc(p.role)+'</span>';
      const activeBtn = '<button type="button" class="pill teamactive '+(p.active?'submitted':'reviewed')+'" data-id="'+p.id+'" data-active="'+p.active+'">'+(p.active?'Active':'Inactive')+'</button>';
      return '<div class="teamrow">' +
        '<div class="avatarmd">'+initialsOf(p.full_name)+'</div>' +
        '<div class="teamwho"><div class="tname">'+esc(p.full_name||'(unnamed)')+(isSelf?' <span class="muted">(you)</span>':'')+'</div>' +
        '<div class="temail">'+esc(p.email||'-')+'</div></div>' +
        '<div class="teamctl">'+roleCtl+activeBtn+'</div>' +
        '</div>';
    }).join('');
    el('teamListHost').innerHTML = '<div class="teamlist">'+cards+'</div>';

    el('teamListHost').querySelectorAll('.teamrole').forEach(sel => {
      sel.onchange = async () => {
        const { error } = await supabase.from('profiles').update({ role: sel.value }).eq('id', sel.dataset.id);
        if (error) { alert('Could not change role: ' + error.message); }
        loadTeam(); reloadEngineers(); reloadManagers();
      };
    });
    el('teamListHost').querySelectorAll('.teamactive').forEach(btn => {
      btn.onclick = async () => {
        const next = btn.dataset.active !== 'true';
        const { error } = await supabase.from('profiles').update({ active: next }).eq('id', btn.dataset.id);
        if (error) { alert('Could not update status: ' + error.message); return; }
        loadTeam(); reloadEngineers();
      };
    });
  }

  function genReference(type) {
    const codes = { 'site-validation':'SV', 'safety-inspection':'SI', 'civils':'Q', 'enquiry':'ENQ' };
    const n = String(Math.floor(1 + Math.random() * 9999)).padStart(4, '0');
    return 'AJSE-' + (codes[type]||'JOB') + '-' + n;
  }

  if (isStaff) {
    renderAssigneeChecks(el('nj-assign'), []);
    el('nj-ref').value = genReference(el('nj-type').value);
    el('nj-type').onchange = () => { el('nj-ref').value = genReference(el('nj-type').value); };
    el('newJobBtn').onclick = () => { el('teamPanel').classList.add('hidden'); el('newJobPanel').classList.remove('hidden'); };
    el('nj-cancel').onclick = () => el('newJobPanel').classList.add('hidden');

    el('teamBtn').onclick = () => {
      el('newJobPanel').classList.add('hidden');
      el('teamPanel').classList.remove('hidden');
      loadTeam();
    };
    el('inv-send').onclick = async () => {
      const full_name = el('inv-name').value.trim();
      const email = el('inv-email').value.trim();
      el('teamMsg').innerHTML = '';
      if (!email) { el('teamMsg').innerHTML = '<div class="msg err">Email is required</div>'; return; }
      el('inv-send').disabled = true;
      const { data, error } = await supabase.functions.invoke('invite-engineer', {
        body: { email, full_name, redirectTo: window.location.origin + '/login.html' }
      });
      el('inv-send').disabled = false;
      if (error) {
        let msg = error.message || 'Could not send invite';
        try { if (error.context) { const body = await error.context.json(); if (body && body.error) msg = body.error; } } catch (e) {}
        el('teamMsg').innerHTML = '<div class="msg err">'+esc(msg)+'</div>';
        return;
      }
      if (data && data.error) { el('teamMsg').innerHTML = '<div class="msg err">'+esc(data.error)+'</div>'; return; }
      el('teamMsg').innerHTML = '<div class="msg ok">Invite sent to '+esc(email)+' - they\'ll get an email to set their password.</div>';
      el('inv-name').value = ''; el('inv-email').value = '';
      loadTeam(); reloadEngineers();
    };
    el('nj-save').onclick = async () => {
      const assigneeIds = checkedIds(el('nj-assign'));
      const payload = {
        reference: el('nj-ref').value.trim(),
        form_type: el('nj-type').value,
        client: el('nj-client').value.trim() || null,
        site_name: el('nj-site').value.trim() || null,
        site_address: el('nj-addr').value.trim() || null,
        due_date: el('nj-due').value || null,
        status: assigneeIds.length ? 'assigned' : 'new',
        created_by: me.id
      };
      if (!payload.reference) { alert('Reference is required'); return; }
      const { data: job, error } = await supabase.from('jobs').insert(payload).select().single();
      if (error) { alert('Could not create job: ' + error.message); return; }
      if (assigneeIds.length) {
        const { error: assignErr } = await supabase.from('job_assignees')
          .insert(assigneeIds.map(engineer_id => ({ job_id: job.id, engineer_id })));
        if (assignErr) { alert('Job created, but could not set assignees: ' + assignErr.message); }
      }
      el('newJobPanel').classList.add('hidden');
      ['nj-client','nj-site','nj-addr','nj-due'].forEach(id => el(id).value = '');
      el('nj-ref').value = genReference(el('nj-type').value);
      renderAssigneeChecks(el('nj-assign'), []);
      loadJobs();
    };
  }

  loadJobs();
})();
</script>
